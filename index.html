<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Main Event">
<meta name="robots" content="noindex,nofollow">
<title>Main Event Preview</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;background:#0A0B0E;color:#fff;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
.wrap{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left)) 24px max(16px,env(safe-area-inset-right));box-sizing:border-box}
.card{width:100%;max-width:360px;text-align:center}
.mark{width:56px;height:56px;margin:0 auto 18px;border-radius:16px;background:linear-gradient(135deg,#F3D27A,#D4AF37 55%,#9C7A1C);display:flex;align-items:center;justify-content:center;color:#0A0B0E;font-weight:800;font-size:20px;letter-spacing:.02em}
h1{font-size:22px;margin:0 0 6px}
p{color:#9AA0AE;margin:0 0 22px;font-size:14px}
#pc{-webkit-text-security:disc;width:100%;box-sizing:border-box;padding:15px 16px;border-radius:14px;border:1px solid #2A2E3A;background:#13151B;color:#fff;font-size:17px;outline:none}
#pc:focus{border-color:#D4AF37}
button{width:100%;margin-top:12px;padding:15px;border:0;border-radius:999px;background:#D4AF37;color:#0A0B0E;font-weight:700;font-size:16px}
button:disabled{opacity:.6}
.view{margin-top:16px;color:#6B7280;font-size:12px}.view a{color:#D4AF37;text-decoration:none}
.hi{display:none;position:fixed;inset:0;z-index:5;background:#000;overflow:hidden;cursor:default;-webkit-user-select:none;user-select:none}
.hi .glow{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:0;animation:fadein 2.4s ease .3s forwards,drift 18s ease-in-out infinite alternate}
.hi .g1{background:radial-gradient(circle,#D4AF37 0,transparent 65%);left:-25vmax;top:-20vmax}
.hi .g2{background:radial-gradient(circle,#6D3BD8 0,transparent 65%);right:-30vmax;bottom:-25vmax;animation-delay:.6s,0s;animation-duration:2.4s,22s}
.hi .g3{background:radial-gradient(circle,#1E6FD9 0,transparent 65%);left:20vmax;bottom:-40vmax;animation-delay:.9s,0s;animation-duration:2.4s,26s}
.hi .stage{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px max(20px,env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-right));box-sizing:border-box;text-align:center}
.hi .greet{font-weight:200;font-size:clamp(30px,8vw,52px);letter-spacing:-.01em;color:#F5F5F7;height:1.3em;margin:0;transition:opacity .35s ease,filter .35s ease,transform .35s ease}
.hi .greet.out{opacity:0;filter:blur(6px);transform:translateY(-6px)}
.hi .who{margin:.05em 0 0;font-weight:700;letter-spacing:-.035em;line-height:1;font-size:clamp(64px,22vw,168px);max-width:100%;word-break:break-word}
.hi .who span{display:inline-block;opacity:0;filter:blur(14px);transform:translateY(18px) scale(.96);background:linear-gradient(110deg,#B8901F 0%,#F3D27A 30%,#FFF6DA 45%,#F3D27A 60%,#C99A2B 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:letter .9s cubic-bezier(.2,.7,.2,1) forwards,shine 5s linear 2.4s infinite}
.hi .sub{margin:22px 0 0;color:#86868B;font-size:15px;letter-spacing:.02em;opacity:0;transition:opacity .8s ease}
.hi .cta{position:absolute;left:0;right:0;bottom:calc(48px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;transform:translateY(8px);transition:opacity .8s ease,transform .8s ease}
.hi .cta button{width:auto;min-width:220px;margin:0;padding:15px 40px;background:#F5F5F7;color:#000;font-weight:600;font-size:17px;border-radius:999px}
.hi .cta small{color:#6E6E73;font-size:12px}
.hi.ready .sub,.hi.ready .cta{opacity:1;transform:none}
.hi.leaving .stage{transition:opacity .45s ease,transform .45s ease;opacity:0;transform:scale(1.04)}
@keyframes letter{to{opacity:1;filter:blur(0);transform:none}}
@keyframes shine{0%{background-position:100% 0}100%{background-position:-200% 0}}
@keyframes fadein{to{opacity:.38}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(8vmax,6vmax)}}
@media (prefers-reduced-motion:reduce){.hi *{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}.hi .glow{opacity:.38}}
.err{color:#FCA5A5;min-height:20px;margin-top:10px;font-size:13px}
</style></head>
<body>
<div class="wrap" id="gate"><div class="hi" id="hi"><div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div><div class="stage"><p class="greet" id="hello"></p><p class="who" id="who"></p><p class="sub" id="sub"></p></div><div class="cta"><button id="enter" type="button">Enter</button><small>or press return</small></div></div><form class="card" id="f">
  <div class="mark">ME</div>
  <h1>Main Event preview</h1>
  <p>Private. Enter the passcode to open it.</p>
  <input id="pc" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" name="me-entry" placeholder="Passcode" autofocus aria-label="Passcode">
  <button id="go" type="submit">Open</button>
  <div class="view"><span id="vname"></span> · <a href="#" id="vswap"></a></div>
  <div class="err" id="err" role="alert"></div>
</form></div>
<script>
var SALT="ylq50b0x24+l5vSFHrG93g==",ITER=600000,FILES={"d": "ab54836034-d.bin", "m": "ab54836034-m.bin"},IVS={"d": "aPiNPjE0vp/euWgI", "m": "XKedmm8BxuZUhleh"},WR=[{"i": "Fx0XTXWcMpA8cSRd", "c": "r/GCX5WPvpSlaBe69oO8rHEnIYkviK7h+3/SF8+4F4Tg2rZNsM/JFrg9X1PLeWIQvP8="}, {"i": "USzXhpOM0+JiZDnX", "c": "GLQRpUQRvQTR+FclHv/diJqEy7YPnYgixtmw50C6SIpIXN9gmC3qLYFv3ZbY6xzo"}, {"i": "M5ckAePc8WO4ZFIz", "c": "UCSSU0/26bUz8OX45X/M2o17SPY2Vhkcem5TTZyZOE5lFvH+JozGY8lpsg7zT4MZebFyyA=="}, {"i": "/VkTZ4u8R5/kzYed", "c": "gDMCMChERO0XGetd/Oo5LQtCY6G2IPxsj1oEltuGEeCGeAj0zkMHP4WrS3PGnJykOqs="}, {"i": "WtN5P/EIXCLlnIiy", "c": "68Iz2kXLnhYzcjOr2Jp5sKxYkrARGAw2HZSAMrb51wwJQoa16huNuR6y51pgFuSFzJEQBfg="}];
function isPhone(){var w=Math.min(screen.width,screen.height);var touch=window.matchMedia&&matchMedia("(pointer:coarse)").matches;return (touch&&w<700)||innerWidth<500;}
var VIEW=isPhone()?"m":"d",got={};
function load(v){if(!got[v])got[v]=fetch(FILES[v],{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("stale");return r.arrayBuffer();});return got[v];}
function label(){document.getElementById("vname").textContent=VIEW=="m"?"Phone view":"Desktop view";document.getElementById("vswap").textContent=VIEW=="m"?"Switch to desktop":"Switch to phone";}
function u8(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function keyFrom(pass){var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:u8(SALT),iterations:ITER,hash:"SHA-256"},base,256);return new Uint8Array(bits);}
async function aes(raw){return crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);}
async function open1(pk){var k=await aes(pk);for(var i=0;i<WR.length;i++){try{var p=new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(WR[i].i)},k,u8(WR[i].c)));return {k:p.slice(0,32),n:new TextDecoder().decode(p.slice(32))};}catch(e){}}return null;}
function stamp(n){if(!n)return "";n=n.replace(/[^A-Za-z0-9 ]/g,"").slice(0,20);var svg='<svg xmlns="http://www.w3.org/2000/svg" width="240" height="150"><text x="120" y="80" transform="rotate(-24 120 75)" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#8A8F9C" fill-opacity="0.13">'+n+'</text></svg>';return '<div aria-hidden="true" style="position:fixed;inset:0;z-index:2147483646;pointer-events:none;background-image:url(&quot;data:image/svg+xml;utf8,'+encodeURIComponent(svg)+'&quot;)"></div>';}
async function unlock(raw,v){
  var key=await aes(raw);var ct=await load(v);
  var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IVS[v])},key,ct);
  var stream=new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(stream).text();
}
var AWAY=60000,HANDOFF=15000;
function guard(k,v,n){return "<script>(function(K,V,N,AWAY){var away=0,lock=false;"+
 "function lockNow(){lock=true;try{sessionStorage.removeItem('me_h')}catch(e){}location.reload();}"+
 "addEventListener('pagehide',function(){if(lock)return;try{sessionStorage.setItem('me_h',JSON.stringify({k:K,v:V,n:N,t:Date.now()}))}catch(e){}});"+
 "addEventListener('pageshow',function(e){if(e.persisted){try{sessionStorage.removeItem('me_h')}catch(x){}if(away&&Date.now()-away>AWAY)lockNow();}});"+
 "document.addEventListener('visibilitychange',function(){if(document.hidden){away=Date.now();}else{if(away&&Date.now()-away>AWAY)lockNow();away=0;}});"+
 "})('"+k+"','"+v+"',"+JSON.stringify(n||"")+","+AWAY+");<\/script>";}
function show(html,k,v,n){html=html.replace("<head>","<head>"+guard(k,v,n));var e=html.lastIndexOf("</body>");html=e<0?html+stamp(n):html.slice(0,e)+stamp(n)+html.slice(e);
  if(v=="d"&&Math.min(screen.width,innerWidth)<1000){var vp='<meta name="viewport" content="width=1280">';html=/<meta name="viewport"[^>]*>/.test(html)?html.replace(/<meta name="viewport"[^>]*>/,vp):html.replace("<head>","<head>"+vp);}document.open();document.write(html);document.close();}
function welcome(html,k,v,n){
  var hi=document.getElementById("hi"),go=document.getElementById("enter"),gr=document.getElementById("hello"),who=document.getElementById("who"),left=0,done=false,T=[];
  var name=n||"Main Event",last=n?"Hello":"Welcome back",seq=["Hola","Bonjour","Ciao",last];
  if(window.matchMedia&&matchMedia("(pointer:coarse)").matches)document.querySelector(".hi .cta small").style.display="none";
  var slow=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;if(slow)seq=[last];
  document.getElementById("sub").textContent=n?"Your private Main Event preview is ready.":"Your Main Event preview is ready.";
  who.textContent="";name.split("").forEach(function(c,i){var sp=document.createElement("span");sp.textContent=c==" "?" ":c;sp.style.animationDelay=(0.07*i)+"s, "+(2.4+0.07*i)+"s";who.appendChild(sp);});
  who.style.visibility="hidden";document.getElementById("gate").firstChild&&(document.getElementById("f").style.display="none");hi.style.display="block";
  var step=0;function next(){if(step>0){gr.classList.add("out");}T.push(setTimeout(function(){gr.textContent=seq[step];gr.classList.remove("out");step++;
    if(step<seq.length)T.push(setTimeout(next,520));else{T.push(setTimeout(function(){who.style.visibility="visible";var w=who.querySelectorAll("span");for(var i=0;i<w.length;i++){w[i].style.animationName="none";void w[i].offsetWidth;w[i].style.animationName="";}},250));T.push(setTimeout(function(){hi.classList.add("ready");go.focus();},900+70*name.length));}},step>0?300:0));}
  next();
  function enter(){if(done)return;done=true;T.forEach(clearTimeout);document.removeEventListener("keydown",key);document.removeEventListener("visibilitychange",vis);hi.classList.add("leaving");setTimeout(function(){show(html,k,v,n);},slow?0:420);}
  function key(e){if(e.key==="Enter")enter();}
  function vis(){if(document.hidden){left=Date.now();}else if(left&&Date.now()-left>AWAY){html=null;done=true;location.reload();}}
  go.addEventListener("click",enter);document.addEventListener("keydown",key);document.addEventListener("visibilitychange",vis);
}
function b64(a){var s="";for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
try{localStorage.removeItem("me_k");sessionStorage.removeItem("me_k");}catch(e){}
(async function(){var h=null;try{h=JSON.parse(sessionStorage.getItem("me_h")||"null");sessionStorage.removeItem("me_h");}catch(e){}
  if(h&&h.k&&Date.now()-h.t<HANDOFF&&Date.now()>=h.t){var v=h.v=="m"||h.v=="d"?h.v:VIEW;try{show(await unlock(u8(h.k),v),h.k,v,typeof h.n=="string"?h.n:"");return;}catch(e){}}
  label();load(VIEW).catch(function(){});})();
document.getElementById("vswap").addEventListener("click",function(e){e.preventDefault();VIEW=VIEW=="m"?"d":"m";label();load(VIEW).catch(function(){});});
document.getElementById("f").addEventListener("submit",async function(e){
  e.preventDefault();var btn=document.getElementById("go"),err=document.getElementById("err");
  var pass=document.getElementById("pc").value.replace(/\s+/g,"").toLowerCase();if(!pass){err.textContent="Enter the passcode.";return;}
  if(!window.crypto||!crypto.subtle||!window.DecompressionStream){err.textContent="This browser is too old to open it. Update iOS or try Chrome.";return;}
  btn.disabled=true;btn.textContent="Opening...";err.textContent="";
  var who=null,html=null,why="That passcode didn't work.";
  try{who=await open1(await keyFrom(pass));}catch(x){who=null;}
  if(who){try{html=await unlock(who.k,VIEW);}catch(x){got[VIEW]=null;why="A newer version just went up. Refresh the page and try again.";}}
  if(html){document.getElementById("pc").value="";welcome(html,b64(who.k),VIEW,who.n);return;}
  btn.disabled=false;btn.textContent="Open";err.textContent=why;
});
</script></body></html>
